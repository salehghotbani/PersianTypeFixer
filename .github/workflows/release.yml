name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11.9'
      - name: Validate version and release notes
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from app_version import VERSION
          assert re.fullmatch(r'\d+\.\d+\.\d+', VERSION), 'Invalid release version'
          tag = f'v{VERSION}'
          assert Path(f'.github/release-notes/{tag}.md').read_text().strip(), 'Missing release notes'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY

  windows:
    needs: metadata
    uses: ./.github/workflows/windows.yml
    with:
      upload_artifacts: true

  linux:
    needs: metadata
    uses: ./.github/workflows/linux.yml
    with:
      upload_artifacts: true

  publish:
    needs: [metadata, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: PersianTypoFixer-*
          path: dist/release
          merge-multiple: true
      - name: Validate files and generate combined checksums
        run: python tools/prepare_publish.py dist/release
      - name: Create or update the release draft
        shell: bash
        run: |
          set -euo pipefail
          notes=".github/release-notes/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            python -c 'import json, sys; assert json.load(open(sys.argv[1]))["isDraft"], "Release is already published"' "$RUNNER_TEMP/release.json"
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Persian Typo Fixer $RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Persian Typo Fixer $RELEASE_TAG" --notes-file "$notes"
          fi
      - name: Upload every asset before publishing
        run: gh release upload "$RELEASE_TAG" dist/release/* --clobber
      - name: Publish as the latest stable release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
