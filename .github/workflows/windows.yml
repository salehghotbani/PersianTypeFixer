name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload_artifacts:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Save release files to Actions storage
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11.9"
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Invalid compiler signature' }
          $process = Start-Process $setup -WindowStyle Hidden -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=`"$compiler`"",'/NOICONS'
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "ISCC=$compiler\ISCC.exe" | Out-File $env:GITHUB_ENV -Append
      - name: Test and build Windows release files
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.upload_artifacts == true
        with:
          name: PersianTypoFixer-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
